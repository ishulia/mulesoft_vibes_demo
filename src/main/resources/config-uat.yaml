# ══════════════════════════════════════════════════════════════════════
# Universal Shipment Tracking API — Configuration (UAT)
#
# Activated by passing -Dmule.env=uat at runtime, combined with a
# <configuration-properties file="config-${mule.env}.yaml" /> element
# in global-configs.xml (add when multi-environment switching is needed).
#
# All credential values should be stored encrypted using the Mule Secure
# Configuration Properties module before populating this file.
# ══════════════════════════════════════════════════════════════════════

http:
  port: "8081"

fedex:
  api:
    host:         "apis.fedex.com"
    clientId:     "REPLACE_WITH_UAT_FEDEX_CLIENT_ID"
    clientSecret: "REPLACE_WITH_UAT_FEDEX_CLIENT_SECRET"

ups:
  api:
    host:         "onlinetools.ups.com"
    clientId:     "REPLACE_WITH_UAT_UPS_CLIENT_ID"
    clientSecret: "REPLACE_WITH_UAT_UPS_CLIENT_SECRET"

dhl:
  api:
    host:   "api-eu.dhl.com"
    apiKey: "REPLACE_WITH_UAT_DHL_API_KEY"

usps:
  api:
    host:   "secure.shippingapis.com"
    userId: "REPLACE_WITH_UAT_USPS_USER_ID"